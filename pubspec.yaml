name: multiplicaciones_columna
description: "Aplicación educativa para practicar multiplicaciones en columna (2 cifras por 1 o por 2 cifras)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # Persistencia local de los récords (no requiere internet).
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
